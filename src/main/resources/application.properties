# HTTP istek/yanit encoding: Turkce karakterlerin (ş, ı, ğ, ü, ö, ç) bozuk
# gorunmesini (ISO-8859-1 varsayilanini) engeller.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Spring Application Name
spring.application.name=security-utility-suite

# Varsayılan profil: H2 (harici bağımlılık yok).
# SQL Server ile çalıştırmak için:  ./gradlew bootRun --args='--spring.profiles.active=sqlserver'
# spring.profiles.active=sqlserver

# H2 Database Configuration
# DOSYA TABANLI: bellek ici (mem) modda uygulama her kapandiginda tum veri —
# kullanici hesabi dahil — siliniyordu. Dosyaya yazinca kayitlar kaliciolur.
spring.datasource.url=jdbc:h2:file:./data/securitysuite;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Properties (H2)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Console — yalnızca ADMIN rolü erişebilir (bkz. SecurityConfig).
# http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
