<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - security-utility-suite</title>
    <style>
        :root {
            --bg-primary: #0a0e14;
            --bg-panel: #11161f;
            --border-color: #232b38;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-teal: #2dd4bf;
            --accent-red: #f85149;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background-color: var(--accent-teal);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .brand-text h1 {
            font-size: 16px;
            font-weight: 700;
        }
        .brand-text p {
            font-size: 12px;
            color: var(--text-secondary);
        }
        h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }
        .field {
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 14px;
        }
        .field input:focus {
            outline: none;
            border-color: var(--accent-teal);
        }
        button {
            width: 100%;
            background-color: var(--accent-teal);
            color: #0a0e14;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            opacity: 0.9;
        }
        .error-msg {
            background-color: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .info-msg {
            background-color: rgba(45, 212, 191, 0.1);
            border: 1px solid var(--accent-teal);
            color: var(--accent-teal);
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">🛡️</div>
            <div class="brand-text">
                <h1>security-utility-suite</h1>
                <p>Ağ Tarayıcı · Dosya Bütünlüğü · Log Analizi</p>
            </div>
        </div>

        <h2>Giriş Yap</h2>
        <p class="subtitle">Devam etmek için hesabına giriş yap</p>

        <div class="error-msg" id="errorMsg">Kullanıcı adı veya şifre hatalı.</div>
        <div class="info-msg" id="logoutMsg">Başarıyla çıkış yaptınız.</div>

        <form action="/perform-login" method="post">
            <div class="field">
                <label for="username">Kullanıcı adı</label>
                <input type="text" id="username" name="username" placeholder="kullanici_adi" required autofocus>
            </div>
            <div class="field">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Giriş Yap</button>
        </form>

        <p class="footer-note" id="footerNote">
            Hesap oluşturma yöneticiye kapalıdır.
        </p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'true') {
            document.getElementById('errorMsg').style.display = 'block';
        }
        if (params.get('logout') === 'true') {
            document.getElementById('logoutMsg').style.display = 'block';
        }

        // Ilk kurulum: sistemde hic kullanici yoksa yonetici hesabi olusturma
        // baglantisi gosterilir. Aksi halde kayit kapalidir.
        fetch('/api/auth/setup-status')
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) {
                if (d && d.setupRequired) {
                    document.getElementById('footerNote').innerHTML =
                        'İlk kurulum: henüz kullanıcı yok. ' +
                        '<a href="#" id="setupLink" style="color:var(--accent-teal);">' +
                        'Yönetici hesabı oluştur</a>';
                    document.getElementById('setupLink')
                        .addEventListener('click', ilkKullaniciOlustur);
                }
            })
            .catch(function () { /* durum alinamadi: varsayilan metin kalir */ });

        function ilkKullaniciOlustur(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            if (!u || p.length < 6) {
                alert('Kullanıcı adı ve en az 6 karakterli şifre girin.');
                return;
            }
            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
            .then(function (res) {
                if (res.ok) {
                    alert('Yönetici hesabı oluşturuldu. Şimdi giriş yapabilirsiniz.');
                    window.location.reload();
                } else {
                    alert(res.b.message || 'Hesap oluşturulamadı.');
                }
            })
            .catch(function () { alert('Sunucuya ulaşılamadı.'); });
        }
    </script>
</body>
</html>
